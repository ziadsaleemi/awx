---
- name: Prepare Capstan server nodes
  hosts: awx_server_nodes
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: server
  roles:
    - awx_deploy_common
    - awx_container_runtime

- name: Deploy PostgreSQL
  hosts: awx_database
  gather_facts: true
  become: true
  roles:
    - awx_postgres

- name: Deploy Redis
  hosts: awx_redis
  gather_facts: true
  become: true
  roles:
    - awx_redis

- name: Deploy Capstan receptor nodes
  hosts: awx_receptor
  gather_facts: true
  become: true
  roles:
    - awx_receptor

- name: Deploy Capstan task nodes
  hosts: awx_task
  gather_facts: true
  become: true
  roles:
    - awx_task

- name: Deploy Capstan web nodes
  hosts: awx_web
  gather_facts: true
  become: true
  roles:
    - awx_web

- name: Deploy Capstan load balancer
  hosts: awx_lb
  gather_facts: true
  become: true
  roles:
    - awx_lb
