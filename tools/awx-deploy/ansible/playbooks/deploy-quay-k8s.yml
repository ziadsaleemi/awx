---
- name: Deploy Project Quay to Kubernetes
  hosts: all
  gather_facts: false
  vars:
    awx_deploy_method: k8s
  pre_tasks:
    - name: Resolve kubectl binary on target
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          (command -v {{ awx_k8s_kubectl_binary | default('kubectl') }}
          || command -v /usr/local/bin/kubectl
          || command -v /usr/bin/kubectl)
      args:
        executable: /bin/bash
      register: awx_quay_k8s_kubectl_binary
      changed_when: false

    - name: Set resolved kubectl binary
      ansible.builtin.set_fact:
        awx_k8s_kubectl_binary: "{{ awx_quay_k8s_kubectl_binary.stdout_lines[0] }}"
  roles:
    - awx_quay_k8s
