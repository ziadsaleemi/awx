---
- name: Deploy AWX to Kubernetes
  hosts: all
  gather_facts: false
  vars:
    awx_deploy_method: k8s
  pre_tasks:
    - name: Resolve kubectl binary on target
      ansible.builtin.shell:
        cmd: >-
          command -v {{ awx_k8s_kubectl_binary | default('kubectl') }} ||
          command -v /usr/local/bin/kubectl ||
          command -v /usr/bin/kubectl
      register: awx_k8s_resolved_kubectl
      changed_when: false

    - name: Use resolved kubectl binary for all Kubernetes roles
      ansible.builtin.set_fact:
        awx_k8s_kubectl_binary: "{{ awx_k8s_resolved_kubectl.stdout_lines[0] }}"
  roles:
    - awx_k8s
    - role: awx_opa_k8s
      when: awx_opa_enabled | default(false) | bool
    - role: awx_gatekeeper_k8s
      when: awx_gatekeeper_enabled | default(false) | bool
    - role: awx_eda_k8s
      when: awx_eda_enabled | default(false) | bool
    - role: awx_galaxy_ng_k8s
      when: awx_galaxy_ng_enabled | default(false) | bool
    - role: awx_quay_k8s
      when: awx_quay_enabled | default(false) | bool
    - role: awx_k8s
      when:
        - awx_refresh_awx_settings_after_integrations | default(true) | bool
        - (awx_opa_enabled | default(false) | bool)
          or (awx_gatekeeper_enabled | default(false) | bool)
          or (awx_eda_enabled | default(false) | bool)
          or (awx_galaxy_ng_enabled | default(false) | bool)
          or (awx_quay_enabled | default(false) | bool)
