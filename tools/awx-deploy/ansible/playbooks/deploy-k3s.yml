---
- name: Install k3s
  hosts: awx_k3s_servers
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
  roles:
    - awx_k3s

- name: Deploy AWX to k3s
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
    awx_k8s_kubectl_binary: /usr/local/bin/kubectl
  roles:
    - awx_k8s

- name: Validate k3s capacity for integrated services
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_k3s_heavy_integrated_services_enabled: >-
      {{ (awx_eda_enabled | default(false) | bool)
         or (awx_galaxy_ng_enabled | default(false) | bool)
         or (awx_quay_enabled | default(false) | bool) }}
    awx_k3s_effective_vcpus: "{{ ansible_processor_vcpus | default(ansible_processor_count) | default(1) | int }}"
    awx_k3s_effective_min_memory_mb: "{{ awx_k3s_min_memory_mb_for_integrated_services | default(16384) | int }}"
    awx_k3s_effective_min_vcpus: "{{ awx_k3s_min_vcpus_for_integrated_services | default(4) | int }}"
  tasks:
    - name: Fail early when k3s VM is too small for EDA, Galaxy NG, or Quay
      ansible.builtin.assert:
        that:
          - ansible_memtotal_mb | int >= awx_k3s_effective_min_memory_mb | int
          - awx_k3s_effective_vcpus | int >= awx_k3s_effective_min_vcpus | int
        fail_msg: >-
          k3s integrated service deployment is enabled, but this node has
          {{ ansible_memtotal_mb }} MB RAM and {{ awx_k3s_effective_vcpus }} vCPU.
          AWX plus EDA Controller, Galaxy NG, or Project Quay requires at least
          {{ awx_k3s_effective_min_memory_mb }} MB RAM and {{ awx_k3s_effective_min_vcpus }} vCPU.
          Resize the k3s VM, disable the heavy integrated services for this run,
          or set awx_k3s_integrated_capacity_check_enabled=false only for an explicit constrained lab run.
      when:
        - awx_k3s_integrated_capacity_check_enabled | default(true) | bool
        - awx_k3s_heavy_integrated_services_enabled | bool

- name: Deploy Gatekeeper to k3s
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
    awx_k8s_kubectl_binary: /usr/local/bin/kubectl
  roles:
    - role: awx_gatekeeper_k8s
      when: awx_gatekeeper_enabled | default(false) | bool

- name: Deploy OPA to k3s
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
    awx_k8s_kubectl_binary: /usr/local/bin/kubectl
  roles:
    - role: awx_opa_k8s
      when: awx_opa_enabled | default(false) | bool

- name: Deploy EDA to k3s
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
    awx_k8s_kubectl_binary: /usr/local/bin/kubectl
  roles:
    - role: awx_eda_k8s
      when: awx_eda_enabled | default(false) | bool

- name: Deploy Galaxy NG to k3s
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
    awx_k8s_kubectl_binary: /usr/local/bin/kubectl
  roles:
    - role: awx_galaxy_ng_k8s
      when: awx_galaxy_ng_enabled | default(false) | bool

- name: Deploy Project Quay to k3s
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
    awx_k8s_kubectl_binary: /usr/local/bin/kubectl
  roles:
    - role: awx_quay_k8s
      when: awx_quay_enabled | default(false) | bool

- name: Refresh AWX k3s settings after integrated services
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
    awx_k8s_kubectl_binary: /usr/local/bin/kubectl
  roles:
    - role: awx_k8s
      when:
        - awx_refresh_awx_settings_after_integrations | default(true) | bool
        - (awx_opa_enabled | default(false) | bool)
          or (awx_gatekeeper_enabled | default(false) | bool)
          or (awx_eda_enabled | default(false) | bool)
          or (awx_galaxy_ng_enabled | default(false) | bool)
          or (awx_quay_enabled | default(false) | bool)
