---
- name: Install k3s
  hosts: awx_k3s_servers
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
  roles:
    - awx_k3s

- name: Deploy AWX to k3s
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
    awx_k8s_kubectl_binary: /usr/local/bin/kubectl
  roles:
    - awx_k8s

- name: Deploy Gatekeeper to k3s
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
    awx_k8s_kubectl_binary: /usr/local/bin/kubectl
  roles:
    - role: awx_gatekeeper_k8s
      when: awx_gatekeeper_enabled | default(false) | bool

- name: Deploy EDA to k3s
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
    awx_k8s_kubectl_binary: /usr/local/bin/kubectl
  roles:
    - role: awx_eda_k8s
      when: awx_eda_enabled | default(false) | bool

- name: Deploy Galaxy NG to k3s
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
    awx_k8s_kubectl_binary: /usr/local/bin/kubectl
  roles:
    - role: awx_galaxy_ng_k8s
      when: awx_galaxy_ng_enabled | default(false) | bool

- name: Deploy Project Quay to k3s
  hosts: awx_k3s_servers[0]
  gather_facts: true
  become: true
  vars:
    awx_deploy_method: k3s
    awx_k8s_kubectl_binary: /usr/local/bin/kubectl
  roles:
    - role: awx_quay_k8s
      when: awx_quay_enabled | default(false) | bool
