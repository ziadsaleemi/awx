---
- name: Validate vCenter lab inputs
  ansible.builtin.assert:
    that:
      - awx_vcenter_hostname | length > 0
      - awx_vcenter_username | length > 0
      - awx_vcenter_password | length > 0
      - awx_vcenter_datacenter | length > 0
      - awx_vcenter_cluster | length > 0
      - awx_vcenter_template | length > 0
      - awx_vcenter_datastore | length > 0
      - awx_vcenter_network | length > 0
    fail_msg: "Set vCenter host/user/password plus datacenter/cluster/template/datastore/network."
  no_log: true

- name: Reject forbidden vCenter datastore names
  ansible.builtin.assert:
    that:
      - item | lower not in (awx_vcenter_datastore | lower)
    fail_msg: "Refusing to use forbidden vCenter datastore '{{ awx_vcenter_datastore }}'. Select a management-local datastore such as datastore1."
  loop: "{{ awx_vcenter_forbidden_datastore_terms | default([]) }}"

- name: Gather vCenter datastore inventory
  community.vmware.vmware_datastore_info:
    hostname: "{{ awx_vcenter_hostname }}"
    username: "{{ awx_vcenter_username }}"
    password: "{{ awx_vcenter_password }}"
    validate_certs: "{{ awx_vcenter_validate_certs }}"
    datacenter_name: "{{ awx_vcenter_datacenter }}"
  register: awx_vcenter_datastore_inventory
  no_log: true

- name: Build vCenter datastore type map
  ansible.builtin.set_fact:
    awx_vcenter_datastore_type_map: >-
      {{
        dict(
          (awx_vcenter_datastore_inventory.datastores | default([]) | map(attribute='name') | list)
          | zip(awx_vcenter_datastore_inventory.datastores | default([]) | map(attribute='type') | list)
        )
      }}

- name: Require selected vCenter datastore to exist
  ansible.builtin.assert:
    that:
      - (awx_vcenter_datastore_type_map.get(awx_vcenter_datastore, '') | length) > 0
    fail_msg: "Refusing unknown vCenter datastore '{{ awx_vcenter_datastore }}'."

- name: Require approved vCenter datastore type
  ansible.builtin.assert:
    that:
      - awx_vcenter_datastore_type_map.get(awx_vcenter_datastore, '') in awx_vcenter_allowed_datastore_types
    fail_msg: "Refusing datastore '{{ awx_vcenter_datastore }}' with type '{{ awx_vcenter_datastore_type_map.get(awx_vcenter_datastore, 'unknown') }}'. Approved datastore types: {{ awx_vcenter_allowed_datastore_types | join(', ') }}."
  when: awx_vcenter_allowed_datastore_types | default([]) | length > 0

- name: Require approved vCenter datastore when configured
  ansible.builtin.assert:
    that:
      - awx_vcenter_datastore in awx_vcenter_allowed_datastore_names
    fail_msg: "Refusing datastore '{{ awx_vcenter_datastore }}'. Approved management datastores: {{ awx_vcenter_allowed_datastore_names | join(', ') }}."
  when: awx_vcenter_allowed_datastore_names | default([]) | length > 0

- name: Gather source template disk backing
  community.vmware.vmware_guest_disk_info:
    hostname: "{{ awx_vcenter_hostname }}"
    username: "{{ awx_vcenter_username }}"
    password: "{{ awx_vcenter_password }}"
    validate_certs: "{{ awx_vcenter_validate_certs }}"
    datacenter: "{{ awx_vcenter_datacenter }}"
    folder: "{{ awx_vcenter_folder | default(omit, true) }}"
    name: "{{ awx_vcenter_template }}"
  register: awx_vcenter_template_disk_info
  no_log: true
  when: awx_vcenter_verify_template_backing | bool

- name: Collect source template disk backing
  ansible.builtin.set_fact:
    awx_vcenter_template_disk_backing_files: >-
      {{
        awx_vcenter_template_disk_info.guest_disk_info | default({})
        | dict2items
        | map(attribute='value.backing_filename')
        | select('defined')
        | list
      }}
    awx_vcenter_template_disk_datastore_names: >-
      {{
        (
          (
            awx_vcenter_template_disk_info.guest_disk_info | default({})
            | dict2items
            | map(attribute='value.backing_datastore')
            | select('defined')
            | list
          )
          +
          (
            awx_vcenter_template_disk_info.guest_disk_info | default({})
            | dict2items
            | map(attribute='value.backing_filename')
            | select('defined')
            | map('regex_replace', '^\\[([^\\]]+)\\].*$', '\\1')
            | list
          )
        )
        | reject('equalto', '')
        | unique
        | list
      }}
  when: awx_vcenter_verify_template_backing | bool

- name: Reject forbidden source template disk backing
  ansible.builtin.assert:
    that:
      - item | lower not in ((awx_vcenter_template_disk_backing_files | default([])) | join(' ') | lower)
      - item | lower not in ((awx_vcenter_template_disk_datastore_names | default([])) | join(' ') | lower)
    fail_msg: "Refusing to clone from template '{{ awx_vcenter_template }}' because its disk backing references forbidden datastore term '{{ item }}'. Template backing files: {{ awx_vcenter_template_disk_backing_files | default([]) }}"
  loop: "{{ awx_vcenter_forbidden_datastore_terms | default([]) }}"
  when:
    - awx_vcenter_verify_template_backing | bool
    - awx_vcenter_template_disk_backing_files | default([]) | length > 0

- name: Require approved source template datastore types
  ansible.builtin.assert:
    that:
      - awx_vcenter_datastore_type_map.get(item, '') in awx_vcenter_allowed_datastore_types
    fail_msg: "Refusing to clone from template '{{ awx_vcenter_template }}' because datastore '{{ item }}' has type '{{ awx_vcenter_datastore_type_map.get(item, 'unknown') }}'. Approved datastore types: {{ awx_vcenter_allowed_datastore_types | join(', ') }}."
  loop: "{{ awx_vcenter_template_disk_datastore_names | default([]) }}"
  when:
    - awx_vcenter_verify_template_backing | bool
    - awx_vcenter_allowed_datastore_types | default([]) | length > 0
    - awx_vcenter_template_disk_datastore_names | default([]) | length > 0

- name: Require approved source template disk backing
  ansible.builtin.assert:
    that:
      - item in awx_vcenter_allowed_datastore_names
    fail_msg: "Refusing to clone from template '{{ awx_vcenter_template }}' because datastore '{{ item }}' is outside approved management datastores: {{ awx_vcenter_allowed_datastore_names | join(', ') }}."
  loop: "{{ awx_vcenter_template_disk_datastore_names | default([]) }}"
  when:
    - awx_vcenter_verify_template_backing | bool
    - awx_vcenter_allowed_datastore_names | default([]) | length > 0
    - awx_vcenter_template_disk_datastore_names | default([]) | length > 0

- name: Create AWX lab VMs from template
  community.vmware.vmware_guest:
    hostname: "{{ awx_vcenter_hostname }}"
    username: "{{ awx_vcenter_username }}"
    password: "{{ awx_vcenter_password }}"
    validate_certs: "{{ awx_vcenter_validate_certs }}"
    datacenter: "{{ awx_vcenter_datacenter }}"
    cluster: "{{ awx_vcenter_cluster }}"
    folder: "{{ awx_vcenter_folder | default(omit, true) }}"
    name: "{{ awx_vcenter_vm_prefix }}-{{ '%02d' | format(item) }}"
    template: "{{ awx_vcenter_template }}"
    datastore: "{{ awx_vcenter_datastore }}"
    state: "{{ awx_vcenter_vm_state }}"
    hardware:
      num_cpus: "{{ awx_vcenter_vm_cpus }}"
      memory_mb: "{{ awx_vcenter_vm_memory_mb }}"
    disk:
      - size_gb: "{{ awx_vcenter_vm_disk_gb }}"
        type: thin
        datastore: "{{ awx_vcenter_datastore }}"
    networks:
      - name: "{{ awx_vcenter_network }}"
        type: dhcp
    wait_for_ip_address: "{{ awx_vcenter_wait_for_ip }}"
  loop: "{{ range(1, (awx_vcenter_vm_count | int) + 1) | list }}"
  register: awx_vcenter_created_vms
  no_log: true

- name: Show created VM names
  ansible.builtin.debug:
    msg: "{{ awx_vcenter_created_vms.results | map(attribute='instance.hw_name') | list }}"
  when: awx_vcenter_created_vms is defined

- name: Build AWX lab VM inventory facts
  ansible.builtin.set_fact:
    awx_vcenter_lab_vms: >-
      {{
        (awx_vcenter_lab_vms | default([])) +
        [{
          'name': vm_instance.hw_name | default(awx_vcenter_vm_prefix ~ '-' ~ ('%02d' | format(item.item | int))),
          'ip': vm_instance.ipv4 | default(vm_instance.ip_address | default(vm_instance.guest_ip_address | default('')))
        }]
      }}
  vars:
    vm_instance: "{{ item.instance | default({}) }}"
  loop: "{{ awx_vcenter_created_vms.results | default([]) }}"
  when: awx_vcenter_created_vms is defined

- name: Gather cloned VM disk backing
  community.vmware.vmware_guest_disk_info:
    hostname: "{{ awx_vcenter_hostname }}"
    username: "{{ awx_vcenter_username }}"
    password: "{{ awx_vcenter_password }}"
    validate_certs: "{{ awx_vcenter_validate_certs }}"
    datacenter: "{{ awx_vcenter_datacenter }}"
    folder: "{{ awx_vcenter_folder | default(omit, true) }}"
    name: "{{ item.instance.hw_name | default(awx_vcenter_vm_prefix ~ '-' ~ ('%02d' | format(item.item | int))) }}"
  loop: "{{ awx_vcenter_created_vms.results | default([]) }}"
  register: awx_vcenter_disk_info
  no_log: true
  when:
    - awx_vcenter_verify_disk_backing | bool
    - awx_vcenter_created_vms is defined

- name: Collect cloned VM disk backing files
  ansible.builtin.set_fact:
    awx_vcenter_disk_backing_files: >-
      {{
        (awx_vcenter_disk_backing_files | default([])) +
        (item.guest_disk_info | default({}) | dict2items | map(attribute='value.backing_filename') | select('defined') | list)
      }}
  loop: "{{ awx_vcenter_disk_info.results | default([]) }}"
  when:
    - awx_vcenter_verify_disk_backing | bool
    - awx_vcenter_disk_info is defined

- name: Collect cloned VM disk datastore names
  ansible.builtin.set_fact:
    awx_vcenter_disk_datastore_names: >-
      {{
        (
          (
            awx_vcenter_disk_info.results | default([])
            | map(attribute='guest_disk_info')
            | select('defined')
            | map('dict2items')
            | flatten
            | map(attribute='value.backing_datastore')
            | select('defined')
            | list
          )
          +
          (
            awx_vcenter_disk_backing_files | default([])
            | map('regex_replace', '^\\[([^\\]]+)\\].*$', '\\1')
            | list
          )
        )
        | reject('equalto', '')
        | unique
      }}
  when:
    - awx_vcenter_verify_disk_backing | bool
    - awx_vcenter_disk_backing_files | default([]) | length > 0

- name: Flag invalid cloned VM disk backing
  ansible.builtin.set_fact:
    awx_vcenter_forbidden_backing_detected: >-
      {{
        awx_vcenter_forbidden_datastore_terms | default([])
        | map('lower')
        | select('in', ((awx_vcenter_disk_backing_files | default([])) | join(' ') | lower))
        | list
        | length > 0
      }}
    awx_vcenter_unapproved_disk_datastores: >-
      {{
        (awx_vcenter_disk_datastore_names | default([]))
        | difference(awx_vcenter_allowed_datastore_names | default([]))
        | list
      }}
  when:
    - awx_vcenter_verify_disk_backing | bool
    - awx_vcenter_disk_backing_files | default([]) | length > 0

- name: Mark cloned VM disk backing as invalid
  ansible.builtin.set_fact:
    awx_vcenter_invalid_disk_backing_detected: >-
      {{
        awx_vcenter_forbidden_backing_detected | default(false) | bool
        or
        (
          awx_vcenter_allowed_datastore_names | default([]) | length > 0
          and
          awx_vcenter_unapproved_disk_datastores | default([]) | length > 0
        )
      }}
  when:
    - awx_vcenter_verify_disk_backing | bool
    - awx_vcenter_disk_backing_files | default([]) | length > 0

- name: Delete cloned lab VMs with invalid disk backing
  community.vmware.vmware_guest:
    hostname: "{{ awx_vcenter_hostname }}"
    username: "{{ awx_vcenter_username }}"
    password: "{{ awx_vcenter_password }}"
    validate_certs: "{{ awx_vcenter_validate_certs }}"
    datacenter: "{{ awx_vcenter_datacenter }}"
    folder: "{{ awx_vcenter_folder | default(omit, true) }}"
    name: "{{ item.instance.hw_name | default(awx_vcenter_vm_prefix ~ '-' ~ ('%02d' | format(item.item | int))) }}"
    state: absent
    force: true
  loop: "{{ awx_vcenter_created_vms.results | default([]) }}"
  no_log: true
  when:
    - awx_vcenter_verify_disk_backing | bool
    - awx_vcenter_delete_on_invalid_backing | bool
    - awx_vcenter_invalid_disk_backing_detected | default(false) | bool
    - awx_vcenter_created_vms is defined

- name: Reject forbidden cloned VM disk backing
  ansible.builtin.assert:
    that:
      - item | lower not in ((awx_vcenter_disk_backing_files | default([])) | join(' ') | lower)
      - item | lower not in ((awx_vcenter_disk_datastore_names | default([])) | join(' ') | lower)
    fail_msg: "vCenter placed a cloned VM disk on a forbidden datastore. Disk backing files: {{ awx_vcenter_disk_backing_files | default([]) }}"
  loop: "{{ awx_vcenter_forbidden_datastore_terms | default([]) }}"
  when:
    - awx_vcenter_verify_disk_backing | bool
    - awx_vcenter_disk_backing_files | default([]) | length > 0

- name: Require approved cloned VM disk datastore types
  ansible.builtin.assert:
    that:
      - awx_vcenter_datastore_type_map.get(item, '') in awx_vcenter_allowed_datastore_types
    fail_msg: "vCenter placed a cloned VM disk on datastore '{{ item }}' with type '{{ awx_vcenter_datastore_type_map.get(item, 'unknown') }}'. Approved datastore types: {{ awx_vcenter_allowed_datastore_types | join(', ') }}."
  loop: "{{ awx_vcenter_disk_datastore_names | default([]) }}"
  when:
    - awx_vcenter_verify_disk_backing | bool
    - awx_vcenter_allowed_datastore_types | default([]) | length > 0
    - awx_vcenter_disk_datastore_names | default([]) | length > 0

- name: Require approved cloned VM disk backing
  ansible.builtin.assert:
    that:
      - (item | regex_replace('^\\[([^\\]]+)\\].*$', '\\1')) in awx_vcenter_allowed_datastore_names
    fail_msg: "vCenter placed a cloned VM disk outside approved management datastores. Disk backing file: {{ item }}. Approved datastores: {{ awx_vcenter_allowed_datastore_names | join(', ') }}."
  loop: "{{ awx_vcenter_disk_backing_files | default([]) }}"
  when:
    - awx_vcenter_verify_disk_backing | bool
    - awx_vcenter_allowed_datastore_names | default([]) | length > 0
    - awx_vcenter_disk_backing_files | default([]) | length > 0

- name: Show cloned VM disk backing
  ansible.builtin.debug:
    msg: "{{ awx_vcenter_disk_backing_files | default([]) }}"
  when:
    - awx_vcenter_verify_disk_backing | bool
    - awx_vcenter_disk_backing_files | default([]) | length > 0

- name: Write generated AWX lab inventory
  ansible.builtin.template:
    src: lab-inventory.ini.j2
    dest: "{{ awx_vcenter_inventory_path }}"
    mode: "0600"
  when:
    - awx_vcenter_inventory_path | length > 0
    - awx_vcenter_lab_vms | default([]) | length > 0

- name: Show generated inventory path
  ansible.builtin.debug:
    msg: "Generated lab inventory: {{ awx_vcenter_inventory_path }}"
  when:
    - awx_vcenter_inventory_path | length > 0
    - awx_vcenter_lab_vms | default([]) | length > 0
