---
- name: Resolve kubectl command for EDA
  ansible.builtin.set_fact:
    awx_k8s_kubectl: >-
      {{ awx_k8s_kubectl_binary | default('kubectl') }}{% if (awx_k8s_kubeconfig | default('')) | length > 0 %} --kubeconfig {{ awx_k8s_kubeconfig }}{% endif %}

- name: Wait for Kubernetes API readiness for EDA
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} get --raw=/readyz"
  register: awx_eda_k8s_readyz
  retries: 60
  delay: 5
  until: awx_eda_k8s_readyz.rc == 0
  changed_when: false

- name: Install EDA Kubernetes manifest dependencies
  ansible.builtin.package:
    name: "{{ awx_eda_k8s_packages }}"
    state: present
  when: awx_eda_k8s_install_packages | bool

- name: Create EDA Kubernetes manifest workspace
  ansible.builtin.file:
    path: "{{ awx_eda_k8s_work_dir }}"
    state: directory
    mode: "0700"

- name: Render EDA Kubernetes manifests
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ awx_eda_k8s_work_dir }}/{{ item }}"
    mode: "0600"
  loop:
    - kustomization.yaml
    - eda.yml
  no_log: true

- name: Create EDA namespace
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} create namespace {{ awx_eda_namespace }}"
  register: awx_eda_k8s_namespace_create
  changed_when: awx_eda_k8s_namespace_create.rc == 0
  failed_when:
    - awx_eda_k8s_namespace_create.rc != 0
    - "'AlreadyExists' not in awx_eda_k8s_namespace_create.stderr"

- name: Apply EDA server operator
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} apply -k {{ awx_eda_k8s_work_dir }}"
  register: awx_eda_k8s_apply_operator
  changed_when: "'created' in awx_eda_k8s_apply_operator.stdout or 'configured' in awx_eda_k8s_apply_operator.stdout"

- name: Pin reachable EDA operator kube-rbac-proxy image
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} -n {{ awx_eda_namespace }} set image deployment/{{ awx_eda_k8s_operator_deployment }} kube-rbac-proxy={{ awx_eda_k8s_kube_rbac_proxy_image }}:{{ awx_eda_k8s_kube_rbac_proxy_image_tag }}"
  register: awx_eda_k8s_proxy_image
  changed_when: "'image updated' in awx_eda_k8s_proxy_image.stdout"
  when:
    - awx_eda_k8s_kube_rbac_proxy_image | length > 0
    - awx_eda_k8s_kube_rbac_proxy_image_tag | length > 0

- name: Wait for EDA custom resource definition
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} wait --for=condition=Established crd/edas.eda.ansible.com --timeout=180s"
  changed_when: false

- name: Wait for EDA operator deployment when present
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} -n {{ awx_eda_namespace }} rollout status deployment/{{ awx_eda_k8s_operator_deployment }} --timeout=300s"
  register: awx_eda_k8s_operator_rollout
  changed_when: false
  failed_when: false

- name: Apply EDA instance
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} apply -f {{ awx_eda_k8s_work_dir }}/eda.yml"
  register: awx_eda_k8s_apply_instance
  changed_when: "'created' in awx_eda_k8s_apply_instance.stdout or 'configured' in awx_eda_k8s_apply_instance.stdout"

- name: Wait for EDA service
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} -n {{ awx_eda_namespace }} get service {{ awx_eda_k8s_api_service_name }}"
  register: awx_eda_k8s_service
  retries: 60
  delay: 10
  until: awx_eda_k8s_service.rc == 0
  changed_when: false
  when: awx_eda_k8s_wait_for_service | bool

- name: Check firewalld state for EDA NodePort
  ansible.builtin.command:
    cmd: systemctl is-active firewalld
  register: awx_eda_k8s_firewalld_state
  changed_when: false
  failed_when: false
  when: awx_eda_k8s_service_type == "NodePort"

- name: Check EDA NodePort firewalld port
  ansible.builtin.command:
    cmd: "firewall-cmd --query-port={{ awx_eda_k8s_node_port }}/tcp"
  register: awx_eda_k8s_firewalld_port
  changed_when: false
  failed_when: false
  when:
    - awx_eda_k8s_service_type == "NodePort"
    - awx_eda_k8s_firewalld_state.stdout == "active"

- name: Open EDA NodePort in firewalld
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --add-port={{ awx_eda_k8s_node_port }}/tcp"
  register: awx_eda_k8s_firewalld_open
  changed_when: true
  when:
    - awx_eda_k8s_service_type == "NodePort"
    - awx_eda_k8s_firewalld_state.stdout == "active"
    - awx_eda_k8s_firewalld_port.rc != 0

- name: Reload firewalld for EDA NodePort
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
  when:
    - awx_eda_k8s_service_type == "NodePort"
    - awx_eda_k8s_firewalld_state.stdout == "active"
    - awx_eda_k8s_firewalld_open is changed
