---
- name: Validate deployment method
  ansible.builtin.assert:
    that:
      - awx_deploy_method in ['server', 'k3s', 'k8s']
      - awx_image | length > 0
      - awx_image_tag | length > 0
    fail_msg: "Set awx_deploy_method to server, k3s, or k8s and provide awx_image/awx_image_tag."

- name: Validate Capstan delivery profile
  ansible.builtin.assert:
    that:
      - awx_product_mode in ['on_prem', 'saas']
      - not (awx_saas_registration_enabled | bool) or awx_product_mode == 'saas'
      - awx_product_mode != 'saas' or (awx_saas_require_external_execution | bool)
      - awx_product_mode != 'saas' or awx_effective_instance_node_type == 'control'
    fail_msg: >-
      awx_product_mode must be on_prem or saas. Public registration is SaaS-only,
      and SaaS deployments must require tenant-owned external execution nodes.

- name: Resolve container engine command
  ansible.builtin.set_fact:
    awx_container_engine_cmd: "{{ 'docker' if awx_container_engine == 'docker' else 'podman' }}"

- name: Validate OPA settings
  ansible.builtin.assert:
    that:
      - not (awx_opa_configure_awx_settings | bool) or (awx_deploy_method in ['k3s', 'k8s']) or ((awx_opa_host | length > 0) or (awx_opa_server_inventory_host | length > 0))
      - awx_opa_auth_type in ['None', 'Token', 'Certificate']
      - awx_opa_port | int > 0
    fail_msg: "When awx_opa_configure_awx_settings=true for server deployments, set awx_opa_host or define an [awx_opa] inventory host. awx_opa_auth_type must be None, Token, or Certificate."

- name: Validate Gatekeeper settings
  ansible.builtin.assert:
    that:
      - not (awx_gatekeeper_configure_awx_settings | bool) or (awx_gatekeeper_k8s_api_url | length > 0)
      - not (awx_gatekeeper_configure_awx_settings | bool and awx_deploy_method == 'server') or ((awx_gatekeeper_k8s_auth_token | length > 0) or ((awx_gatekeeper_k8s_contexts | default({})) | length > 0))
      - awx_gatekeeper_k8s_request_timeout | int > 0
    fail_msg: "Gatekeeper settings require a Kubernetes API URL. Server deployments must also pass a token or named context map for the remote Kubernetes cluster."

- name: Validate server secrets
  ansible.builtin.assert:
    that:
      - awx_admin_password | length > 0
      - awx_postgres_password | length > 0
    fail_msg: "Set AWX_ADMIN_PASSWORD and AWX_POSTGRES_PASSWORD through env, vault, or extra vars."
  when:
    - awx_validate_app_secrets | default(true) | bool
    - awx_deploy_method in ['server', 'k3s', 'k8s']
  no_log: true

- name: Create Capstan server directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(awx_server_root_owner) }}"
    group: "{{ item.group | default(awx_server_root_group) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - path: "{{ awx_server_base_dir }}"
    - path: "{{ awx_server_config_dir }}"
    - path: "{{ awx_server_config_dir }}/conf.d"
    - path: "{{ awx_server_data_dir }}"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
    - path: "{{ awx_projects_dir }}"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
    - path: "{{ awx_media_dir }}"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
    - path: "{{ awx_containers_storage_dir }}"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
    - path: "{{ awx_receptor_socket_dir }}"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
    - path: "{{ awx_nginx_state_dir }}"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
    - path: "{{ awx_nginx_state_dir }}/tmp"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
    - path: "{{ awx_nginx_state_dir }}/tmp/client_body"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
    - path: "{{ awx_nginx_state_dir }}/tmp/proxy"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
    - path: "{{ awx_nginx_state_dir }}/tmp/fastcgi"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
    - path: "{{ awx_nginx_state_dir }}/tmp/uwsgi"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
    - path: "{{ awx_nginx_state_dir }}/tmp/scgi"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
    - path: "{{ awx_rsyslog_dir }}"
      owner: "{{ awx_server_runtime_owner }}"
      group: "{{ awx_server_runtime_group }}"
      mode: "0775"
  when: inventory_hostname in (groups.get('awx_server_nodes', []) | default([]))

- name: Check existing Capstan secret key
  ansible.builtin.stat:
    path: "{{ awx_server_config_dir }}/SECRET_KEY"
  register: awx_secret_key_stat
  delegate_to: "{{ groups.get('awx_server_nodes', [inventory_hostname]) | first }}"
  run_once: true
  when: inventory_hostname in (groups.get('awx_server_nodes', []) | default([]))

- name: Generate Capstan secret key
  ansible.builtin.command:
    cmd: openssl rand -base64 32
  register: awx_generated_secret_key
  changed_when: false
  delegate_to: "{{ groups.get('awx_server_nodes', [inventory_hostname]) | first }}"
  run_once: true
  when:
    - inventory_hostname in (groups.get('awx_server_nodes', []) | default([]))
    - not awx_secret_key_stat.stat.exists
  no_log: true

- name: Persist Capstan secret key
  ansible.builtin.copy:
    dest: "{{ awx_server_config_dir }}/SECRET_KEY"
    content: "{{ awx_generated_secret_key.stdout }}\n"
    owner: "{{ awx_server_root_owner }}"
    group: "{{ awx_server_root_group }}"
    mode: "0644"
  delegate_to: "{{ groups.get('awx_server_nodes', [inventory_hostname]) | first }}"
  run_once: true
  when:
    - inventory_hostname in (groups.get('awx_server_nodes', []) | default([]))
    - not awx_secret_key_stat.stat.exists
  no_log: true

- name: Read cluster Capstan secret key
  ansible.builtin.slurp:
    src: "{{ awx_server_config_dir }}/SECRET_KEY"
  register: awx_cluster_secret_key
  delegate_to: "{{ groups.get('awx_server_nodes', [inventory_hostname]) | first }}"
  run_once: true
  when: inventory_hostname in (groups.get('awx_server_nodes', []) | default([]))
  no_log: true

- name: Sync cluster Capstan secret key
  ansible.builtin.copy:
    dest: "{{ awx_server_config_dir }}/SECRET_KEY"
    content: "{{ awx_cluster_secret_key.content | b64decode }}"
    owner: "{{ awx_server_root_owner }}"
    group: "{{ awx_server_root_group }}"
    mode: "0644"
  when: inventory_hostname in (groups.get('awx_server_nodes', []) | default([]))
  no_log: true

- name: Check existing Capstan system UUID
  ansible.builtin.stat:
    path: "{{ awx_server_config_dir }}/SYSTEM_UUID"
  register: awx_system_uuid_stat
  delegate_to: "{{ groups.get('awx_server_nodes', [inventory_hostname]) | first }}"
  run_once: true
  when: inventory_hostname in (groups.get('awx_server_nodes', []) | default([]))

- name: Generate Capstan system UUID
  ansible.builtin.command:
    cmd: python3 -c 'import uuid; print(uuid.uuid4())'
  register: awx_generated_system_uuid
  changed_when: false
  delegate_to: "{{ groups.get('awx_server_nodes', [inventory_hostname]) | first }}"
  run_once: true
  when:
    - inventory_hostname in (groups.get('awx_server_nodes', []) | default([]))
    - not awx_system_uuid_stat.stat.exists

- name: Persist Capstan system UUID
  ansible.builtin.copy:
    dest: "{{ awx_server_config_dir }}/SYSTEM_UUID"
    content: "{{ awx_generated_system_uuid.stdout }}\n"
    owner: "{{ awx_server_root_owner }}"
    group: "{{ awx_server_root_group }}"
    mode: "0644"
  delegate_to: "{{ groups.get('awx_server_nodes', [inventory_hostname]) | first }}"
  run_once: true
  when:
    - inventory_hostname in (groups.get('awx_server_nodes', []) | default([]))
    - not awx_system_uuid_stat.stat.exists

- name: Read cluster Capstan system UUID
  ansible.builtin.slurp:
    src: "{{ awx_server_config_dir }}/SYSTEM_UUID"
  register: awx_cluster_system_uuid
  delegate_to: "{{ groups.get('awx_server_nodes', [inventory_hostname]) | first }}"
  run_once: true
  when: inventory_hostname in (groups.get('awx_server_nodes', []) | default([]))

- name: Sync cluster Capstan system UUID
  ansible.builtin.copy:
    dest: "{{ awx_server_config_dir }}/SYSTEM_UUID"
    content: "{{ awx_cluster_system_uuid.content | b64decode }}"
    owner: "{{ awx_server_root_owner }}"
    group: "{{ awx_server_root_group }}"
    mode: "0644"
  when: inventory_hostname in (groups.get('awx_server_nodes', []) | default([]))

- name: Render Capstan settings
  ansible.builtin.template:
    src: settings.py.j2
    dest: "{{ awx_server_config_dir }}/settings.py"
    owner: "{{ awx_server_root_owner }}"
    group: "{{ awx_server_root_group }}"
    mode: "0644"
  when: inventory_hostname in (groups.get('awx_server_nodes', []) | default([]))
  no_log: true

- name: Render Capstan nginx config
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ awx_server_config_dir }}/{{ item.dest }}"
    owner: "{{ awx_server_root_owner }}"
    group: "{{ awx_server_root_group }}"
    mode: "0644"
  loop:
    - src: nginx.conf.j2
      dest: nginx.conf
    - src: nginx.locations.conf.j2
      dest: nginx.locations.conf
  when: inventory_hostname in (groups.get('awx_web', []) | default([]))

- name: Render receptor config
  ansible.builtin.template:
    src: receptor.conf.j2
    dest: "{{ awx_server_config_dir }}/receptor.conf"
    owner: "{{ awx_server_root_owner }}"
    group: "{{ awx_server_root_group }}"
    mode: "0644"
  when: inventory_hostname in (groups.get('awx_receptor', []) | default([]))
