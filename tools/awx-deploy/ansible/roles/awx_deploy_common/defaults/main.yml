---
awx_deploy_method: server

awx_image: docker.io/ziadsaleemi/awx
awx_image_tag: "25.1.12"
awx_skip_image_pull: false
awx_ee_image: quay.io/ansible/awx-ee:latest

awx_admin_user: admin
awx_admin_password: "{{ lookup('env', 'AWX_ADMIN_PASSWORD') }}"

awx_container_engine: podman
awx_server_base_dir: /opt/awx
awx_server_config_dir: /etc/awx
awx_server_data_dir: /var/lib/awx
awx_server_backup_dir: /var/backups/awx
awx_server_root_owner: root
awx_server_root_group: root
awx_server_runtime_owner: "1000"
awx_server_runtime_group: "0"
awx_server_http_port: 8080
awx_server_https_port: 8443
awx_server_pod_name: awx
awx_web_http_port: 8013

awx_allowed_hosts:
  - "*"
awx_csrf_trusted_origins: []
awx_proxy_ip_allowed_list: []
awx_remote_host_headers:
  - HTTP_X_FORWARDED_FOR
  - REMOTE_ADDR
  - REMOTE_HOST
awx_tower_url_base: ""
awx_session_cookie_secure: ""
awx_csrf_cookie_secure: ""

awx_ldap_enabled: false
awx_ldap_server_uri: "{{ lookup('env', 'AUTH_LDAP_SERVER_URI') }}"
awx_ldap_bind_dn: "{{ lookup('env', 'AUTH_LDAP_BIND_DN') }}"
awx_ldap_bind_password: "{{ lookup('env', 'AUTH_LDAP_BIND_PASSWORD') }}"
awx_ldap_start_tls: false
awx_ldap_connection_options:
  OPT_REFERRALS: 0
  OPT_NETWORK_TIMEOUT: 30
awx_ldap_user_search: []
awx_ldap_user_dn_template: null
awx_ldap_user_attr_map:
  first_name: givenName
  last_name: sn
  email: mail
awx_ldap_group_search: []
awx_ldap_group_type: MemberDNGroupType
awx_ldap_group_type_params:
  member_attr: member
  name_attr: cn
awx_ldap_require_group: null
awx_ldap_deny_group: null
awx_ldap_user_flags_by_group: {}
awx_ldap_organization_map: {}
awx_ldap_team_map: {}

awx_entra_enabled: false
awx_entra_client_id: "{{ lookup('env', 'SOCIAL_AUTH_AZUREAD_TENANT_OAUTH2_KEY') }}"
awx_entra_client_secret: "{{ lookup('env', 'SOCIAL_AUTH_AZUREAD_TENANT_OAUTH2_SECRET') }}"
awx_entra_tenant_id: "{{ lookup('env', 'SOCIAL_AUTH_AZUREAD_TENANT_OAUTH2_TENANT_ID') }}"
awx_entra_authority_host: "{{ lookup('env', 'SOCIAL_AUTH_AZUREAD_TENANT_OAUTH2_AUTHORITY_HOST') | default('login.microsoftonline.com', true) }}"
awx_entra_organization_map: {}
awx_entra_team_map: {}

awx_postgres_inventory_host: "{{ groups.get('awx_database', ['127.0.0.1']) | first }}"
awx_postgres_host: "{{ hostvars.get(awx_postgres_inventory_host, {}).get('ansible_host', awx_postgres_inventory_host) }}"
awx_postgres_port: 5432
awx_postgres_database: awx
awx_postgres_user: awx
awx_postgres_password: "{{ lookup('env', 'AWX_POSTGRES_PASSWORD') }}"
awx_postgres_image: quay.io/sclorg/postgresql-15-c9s
awx_postgres_data_dir: "{{ awx_server_data_dir }}/postgres"

awx_redis_inventory_host: "{{ groups.get('awx_redis', ['127.0.0.1']) | first }}"
awx_redis_host: "{{ hostvars.get(awx_redis_inventory_host, {}).get('ansible_host', awx_redis_inventory_host) }}"
awx_redis_port: 6379
awx_redis_image: docker.io/library/redis:7.4
awx_redis_data_dir: "{{ awx_server_data_dir }}/redis"

awx_projects_dir: "{{ awx_server_data_dir }}/projects"
awx_media_dir: "{{ awx_server_data_dir }}/media"
awx_containers_storage_dir: "{{ awx_server_data_dir }}/containers"
awx_receptor_socket_dir: "{{ awx_server_data_dir }}/receptor"
awx_receptor_socket_file: /var/run/awx-receptor/receptor.sock
awx_receptor_listen_port: 2222
awx_receptor_log_level: info
awx_receptor_work_type: local
awx_receptor_runner_command: /var/lib/awx/venv/awx/bin/ansible-runner
awx_receptor_enable_tcp_listener: true
awx_receptor_enable_work_signing: false
awx_receptor_peer_hosts: "{{ groups.get('awx_receptor', []) | difference([inventory_hostname]) }}"
awx_receptor_container_privileged: true
awx_receptor_container_extra_args: ""
awx_instance_node_type: hybrid
awx_nginx_state_dir: "{{ awx_server_data_dir }}/nginx"
awx_rsyslog_dir: "{{ awx_server_data_dir }}/rsyslog"

awx_lb_http_port: 80
awx_lb_extra_http_ports: []
awx_lb_https_port: 443
awx_lb_stats_port: 1936
awx_lb_bind_address: "0.0.0.0"
awx_lb_threads: 1
awx_lb_check_interval: 10s
awx_lb_check_timeout: 30s
awx_lb_check_fall: 6
awx_lb_check_rise: 2

awx_k8s_namespace: awx
awx_k8s_name: awx
awx_k8s_storage_class: ""
awx_k8s_postgres_storage_size: 20Gi
awx_k8s_projects_storage_size: 10Gi
awx_k8s_web_replicas: 2
awx_k8s_task_replicas: 2
awx_k8s_ee_builds_enabled: false
awx_k8s_service_type: ClusterIP
awx_k8s_node_port: 30813
awx_k8s_ingress_enabled: false
awx_k8s_ingress_host: ""
awx_k8s_kubectl_binary: kubectl
awx_k8s_kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
awx_k8s_work_dir: /tmp/awx-k8s
awx_k8s_host_aliases: []
awx_k8s_manage_firewalld: true
awx_k8s_firewalld_trusted_interfaces:
  - cni0
  - flannel.1
awx_k8s_firewalld_kubelet_metrics_port: 10250

awx_k3s_install_url: https://get.k3s.io
awx_k3s_channel: stable
awx_k3s_write_kubeconfig_mode: "0644"
awx_k3s_disable:
  - traefik
  - network-policy

awx_backup_name: "awx-{{ ansible_date_time.iso8601_basic_short | default('manual') }}"
awx_restore_confirm: false
awx_restore_path: ""
awx_k8s_backup_dir: "{{ awx_server_backup_dir }}"
awx_k8s_backup_name: "{{ awx_backup_name }}"
awx_k8s_backup_collect_projects: true
awx_k8s_restore_path: "{{ awx_restore_path }}"
awx_k8s_restore_confirm: "{{ awx_restore_confirm }}"
awx_k8s_restore_start_after_restore: true
awx_k8s_restore_data: true
awx_k8s_restore_helper_pod: "{{ awx_k8s_name }}-restore-helper"

awx_eda_enabled: false
awx_eda_configure_awx_settings: "{{ awx_eda_enabled }}"
awx_eda_namespace: eda
awx_eda_name: awx-eda
awx_eda_admin_user: admin
awx_eda_admin_password: "{{ lookup('env', 'EDA_ADMIN_PASSWORD') | default(awx_admin_password, true) }}"
awx_eda_server_url: ""
awx_eda_username: "{{ awx_eda_admin_user }}"
awx_eda_password: "{{ awx_eda_admin_password }}"
awx_eda_verify_ssl: false
awx_eda_request_timeout: 30
awx_eda_allow_local_resource_management: true
awx_eda_automation_server_url: ""
awx_eda_event_stream_base_url: ""

awx_eda_server_repo_url: https://github.com/ansible/eda-server.git
awx_eda_server_repo_version: main
awx_eda_server_base_dir: /opt/eda-server
awx_eda_server_repo_dir: "{{ awx_eda_server_base_dir }}/src"
awx_eda_server_env_file: "{{ awx_eda_server_base_dir }}/eda.env"
awx_eda_server_compose_project: eda
awx_eda_server_compose_file: tools/docker/docker-compose-stage.yaml
awx_eda_server_compose_command: /usr/bin/docker compose
awx_eda_server_install_packages: true
awx_eda_server_packages:
  - git
  - docker
  - docker-compose-plugin
awx_eda_server_api_port: 8000
awx_eda_server_ui_port: 8443
awx_eda_server_health_path: /_healthz
awx_eda_server_wait_for_health: true
awx_eda_server_image_url: ""
awx_eda_server_ui_image: ""

awx_eda_k8s_operator_ref: "1.0.2"
awx_eda_k8s_operator_kustomize_url: "github.com/ansible/eda-server-operator/config/default?ref={{ awx_eda_k8s_operator_ref }}"
awx_eda_k8s_operator_image: quay.io/ansible/eda-server-operator
awx_eda_k8s_operator_image_tag: "1.0.2"
awx_eda_k8s_kube_rbac_proxy_image: quay.io/brancz/kube-rbac-proxy
awx_eda_k8s_kube_rbac_proxy_image_tag: v0.15.0
awx_eda_k8s_operator_deployment: eda-server-operator-controller-manager
awx_eda_k8s_operator_leader_election_enabled: false
awx_eda_k8s_operator_liveness_timeout_seconds: 5
awx_eda_k8s_operator_liveness_failure_threshold: 6
awx_eda_k8s_operator_readiness_timeout_seconds: 5
awx_eda_k8s_operator_readiness_failure_threshold: 6
awx_eda_k8s_service_type: ClusterIP
awx_eda_k8s_node_port: 30855
awx_eda_k8s_api_service_name: "{{ awx_eda_name }}-api"
awx_eda_k8s_api_service_port: 8000
awx_eda_k8s_api_url: "http://{{ awx_eda_k8s_api_service_name }}.{{ awx_eda_namespace }}.svc.cluster.local:{{ awx_eda_k8s_api_service_port }}"
awx_eda_k8s_work_dir: "{{ awx_k8s_work_dir }}/eda"
awx_eda_k8s_wait_for_service: true

awx_galaxy_ng_enabled: false
awx_galaxy_ng_configure_awx_settings: "{{ awx_galaxy_ng_enabled }}"
awx_galaxy_ng_server_inventory_host: "{{ groups.get('awx_galaxy_ng', []) | first | default('') }}"
awx_galaxy_ng_namespace: galaxy-ng
awx_galaxy_ng_name: awx-galaxy-ng
awx_galaxy_ng_image: quay.io/ansible/galaxy-ng
awx_galaxy_ng_image_tag: latest
awx_galaxy_ng_admin_user: admin
awx_galaxy_ng_admin_password: "{{ lookup('env', 'GALAXY_NG_ADMIN_PASSWORD') | default(awx_admin_password, true) }}"
awx_galaxy_ng_auth_token: "{{ lookup('env', 'GALAXY_NG_AUTH_TOKEN') | default('', true) }}"
awx_galaxy_ng_server_url: ""
awx_galaxy_ng_username: "{{ awx_galaxy_ng_admin_user }}"
awx_galaxy_ng_password: "{{ awx_galaxy_ng_admin_password }}"
awx_galaxy_ng_verify_ssl: false
awx_galaxy_ng_request_timeout: 10
awx_galaxy_ng_api_path_prefix: /api/galaxy/
awx_galaxy_ng_content_path_prefix: /pulp/content/
awx_galaxy_ng_public_port: 5001
awx_galaxy_ng_service_type: ClusterIP
awx_galaxy_ng_node_port: 30501
awx_galaxy_ng_postgres_access_mode: ReadWriteOnce
awx_galaxy_ng_pulp_access_mode: ReadWriteOnce
awx_galaxy_ng_k8s_url: "http://{{ awx_galaxy_ng_name }}.{{ awx_galaxy_ng_namespace }}.svc.cluster.local:{{ awx_galaxy_ng_public_port }}"

awx_quay_enabled: false
awx_quay_configure_awx_settings: "{{ awx_quay_enabled }}"
awx_quay_server_inventory_host: "{{ groups.get('awx_quay', []) | first | default('') }}"
awx_quay_k8s_namespace: quay
awx_quay_name: awx-quay
awx_quay_image: quay.io/projectquay/quay
awx_quay_image_tag: latest
awx_quay_namespace: admin
awx_quay_registry_url: ""
awx_quay_public_port: 8081
awx_quay_k8s_url: "http://{{ awx_quay_name }}.{{ awx_quay_k8s_namespace }}.svc.cluster.local:{{ awx_quay_public_port }}"
awx_quay_api_token: "{{ lookup('env', 'QUAY_API_TOKEN') | default('', true) }}"
awx_quay_push_username: "{{ lookup('env', 'QUAY_PUSH_USERNAME') | default('', true) }}"
awx_quay_push_token: "{{ lookup('env', 'QUAY_PUSH_TOKEN') | default('', true) }}"
awx_quay_token_secret_name: "{{ awx_quay_name }}-awx-tokens"
awx_quay_bootstrap_token_title: Capstan Project Quay Management
awx_refresh_awx_settings_after_integrations: true
awx_quay_verify_ssl: false
awx_quay_request_timeout: 10
awx_quay_service_type: ClusterIP
awx_quay_node_port: 30881
awx_quay_postgres_access_mode: ReadWriteOnce
awx_quay_storage_access_mode: ReadWriteOnce
awx_quay_postgres_storage_size: 20Gi
awx_quay_registry_storage_size: 50Gi

awx_opa_enabled: false
awx_opa_configure_awx_settings: "{{ awx_opa_enabled }}"
awx_opa_server_inventory_host: "{{ groups.get('awx_opa', []) | first | default('') }}"
awx_opa_host: ""
awx_opa_port: 8181
awx_opa_ssl: false
awx_opa_auth_type: None
awx_opa_auth_token: "{{ lookup('env', 'OPA_AUTH_TOKEN') | default('', true) }}"
awx_opa_auth_client_cert: "{{ lookup('env', 'OPA_AUTH_CLIENT_CERT') | default('', true) }}"
awx_opa_auth_client_key: "{{ lookup('env', 'OPA_AUTH_CLIENT_KEY') | default('', true) }}"
awx_opa_auth_ca_cert: "{{ lookup('env', 'OPA_AUTH_CA_CERT') | default('', true) }}"
awx_opa_auth_custom_headers: {}
awx_opa_request_timeout: 1.5
awx_opa_request_retries: 2
awx_opa_policy_bundle: ""
awx_opa_container_image: docker.io/openpolicyagent/opa:latest
awx_opa_container_name: awx-opa
awx_opa_server_base_dir: /opt/opa
awx_opa_server_data_dir: "{{ awx_opa_server_base_dir }}/policies"
awx_opa_server_policy_file: "{{ awx_opa_server_data_dir }}/awx.rego"
awx_opa_server_policy: ""
awx_opa_server_http_port: "{{ awx_opa_port }}"
awx_opa_server_addr: "0.0.0.0:{{ awx_opa_server_http_port }}"
awx_opa_server_log_level: info
awx_opa_k8s_namespace: opa
awx_opa_name: awx-opa
awx_opa_k8s_host: "{{ awx_opa_name }}.{{ awx_opa_k8s_namespace }}.svc.cluster.local"
awx_opa_k8s_service_type: ClusterIP
awx_opa_k8s_node_port: 30818
awx_opa_k8s_replicas: 1
awx_opa_k8s_work_dir: "{{ awx_k8s_work_dir }}/opa"
awx_opa_k8s_wait_for_service: true

awx_gatekeeper_enabled: false
awx_gatekeeper_configure_awx_settings: "{{ awx_gatekeeper_enabled }}"
awx_gatekeeper_namespace: gatekeeper-system
awx_gatekeeper_version: v3.22.2
awx_gatekeeper_manifest_url: "https://raw.githubusercontent.com/open-policy-agent/gatekeeper/{{ awx_gatekeeper_version }}/deploy/gatekeeper.yaml"
awx_gatekeeper_manifest_cache_dir: /var/cache/awx-deploy/gatekeeper
awx_gatekeeper_manifest_path: "{{ awx_gatekeeper_manifest_cache_dir }}/gatekeeper-{{ awx_gatekeeper_version }}.yaml"
awx_gatekeeper_manifest_download_retries: 5
awx_gatekeeper_manifest_download_delay: 15
awx_gatekeeper_reapply_existing: false
awx_gatekeeper_wait_for_rollout: true
awx_gatekeeper_controller_deployment: gatekeeper-controller-manager
awx_gatekeeper_audit_deployment: gatekeeper-audit
awx_gatekeeper_k8s_api_url: https://kubernetes.default.svc
awx_gatekeeper_k8s_auth_token: "{{ lookup('env', 'GATEKEEPER_K8S_AUTH_TOKEN') | default('', true) }}"
awx_gatekeeper_k8s_use_service_account_token: true
awx_gatekeeper_k8s_context: in-cluster
awx_gatekeeper_k8s_contexts: {}
awx_gatekeeper_k8s_verify_ssl: true
awx_gatekeeper_k8s_request_timeout: 5
awx_gatekeeper_k8s_manage_rbac: "{{ awx_gatekeeper_configure_awx_settings }}"
