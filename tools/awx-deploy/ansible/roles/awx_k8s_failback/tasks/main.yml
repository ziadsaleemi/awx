---
- name: Validate Kubernetes failback target
  ansible.builtin.assert:
    that:
      - awx_failback_image_tag | length > 0 or awx_failback_restore_path | length > 0
    fail_msg: "Set awx_failback_image_tag for image failback or awx_failback_restore_path for full Kubernetes restore."

- name: Restore AWX Kubernetes backup for failback
  ansible.builtin.include_role:
    name: awx_k8s_restore
  vars:
    awx_k8s_restore_path: "{{ awx_failback_restore_path }}"
    awx_k8s_restore_confirm: true
    awx_k8s_restore_start_after_restore: "{{ awx_failback_image_tag | length == 0 }}"
  when: awx_failback_restore_path | length > 0

- name: Resolve kubectl command for Kubernetes image failback service preservation
  ansible.builtin.set_fact:
    awx_k8s_failback_kubectl: >-
      {{ awx_k8s_kubectl_binary }}{% if awx_k8s_kubeconfig | length > 0 %} --kubeconfig {{ awx_k8s_kubeconfig }}{% endif %}
  when:
    - awx_failback_image_tag | length > 0
    - awx_failback_preserve_k8s_service | bool

- name: Read current AWX Kubernetes web service type
  ansible.builtin.command:
    cmd: "{{ awx_k8s_failback_kubectl }} -n {{ awx_k8s_namespace }} get service {{ awx_k8s_name }}-web -o jsonpath='{.spec.type}'"
  register: awx_k8s_failback_existing_service_type
  changed_when: false
  failed_when: false
  when:
    - awx_failback_image_tag | length > 0
    - awx_failback_preserve_k8s_service | bool

- name: Read current AWX Kubernetes web service node port
  ansible.builtin.command:
    cmd: "{{ awx_k8s_failback_kubectl }} -n {{ awx_k8s_namespace }} get service {{ awx_k8s_name }}-web -o jsonpath='{.spec.ports[0].nodePort}'"
  register: awx_k8s_failback_existing_node_port
  changed_when: false
  failed_when: false
  when:
    - awx_failback_image_tag | length > 0
    - awx_failback_preserve_k8s_service | bool

- name: Decide whether to preserve AWX Kubernetes service settings for image failback
  ansible.builtin.set_fact:
    awx_k8s_failback_preserve_existing_service: >-
      {{ awx_failback_preserve_k8s_service | bool
        and awx_k8s_service_type == 'ClusterIP'
        and awx_k8s_failback_existing_service_type.stdout | default('') in ['NodePort', 'LoadBalancer'] }}
  when: awx_failback_image_tag | length > 0

- name: Resolve AWX Kubernetes service settings for image failback
  ansible.builtin.set_fact:
    awx_k8s_failback_effective_service_type: >-
      {{ awx_k8s_failback_existing_service_type.stdout
        if awx_k8s_failback_preserve_existing_service | bool
        else awx_k8s_service_type }}
    awx_k8s_failback_effective_node_port: >-
      {{ awx_k8s_failback_existing_node_port.stdout
        if awx_k8s_failback_preserve_existing_service | bool
          and awx_k8s_failback_existing_node_port.stdout | default('') | length > 0
        else awx_k8s_node_port }}
  when: awx_failback_image_tag | length > 0

- name: Re-apply AWX Kubernetes deployment for image failback
  ansible.builtin.include_role:
    name: awx_k8s
  vars:
    awx_image_tag: "{{ awx_failback_image_tag }}"
    awx_k8s_service_type: "{{ awx_k8s_failback_effective_service_type }}"
    awx_k8s_node_port: "{{ awx_k8s_failback_effective_node_port }}"
  when: awx_failback_image_tag | length > 0
