---
- name: Render Capstan receptor systemd service
  ansible.builtin.template:
    src: awx-receptor.service.j2
    dest: /etc/systemd/system/awx-receptor.service
    owner: "{{ awx_server_root_owner }}"
    group: "{{ awx_server_root_group }}"
    mode: "0644"
  notify: Reload systemd

- name: Flush systemd handlers
  ansible.builtin.meta: flush_handlers

- name: Start Capstan receptor
  ansible.builtin.systemd:
    name: awx-receptor
    state: restarted
    enabled: true

- name: Wait for Capstan receptor control socket
  ansible.builtin.wait_for:
    path: "{{ awx_receptor_socket_dir }}/{{ awx_receptor_socket_file | basename }}"
    timeout: 120
