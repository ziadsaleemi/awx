---
- name: Create Redis data directory
  ansible.builtin.file:
    path: "{{ awx_redis_data_dir }}"
    state: directory
    owner: "999"
    group: "0"
    mode: "0770"

- name: Render Redis systemd service
  ansible.builtin.template:
    src: awx-redis.service.j2
    dest: /etc/systemd/system/awx-redis.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush systemd handlers
  ansible.builtin.meta: flush_handlers

- name: Start Redis
  ansible.builtin.systemd:
    name: awx-redis
    state: started
    enabled: true

- name: Wait for Redis
  ansible.builtin.wait_for:
    host: "{{ awx_redis_host }}"
    port: "{{ awx_redis_port }}"
    timeout: 60

- name: Check firewalld state for Redis
  ansible.builtin.command:
    cmd: systemctl is-active firewalld
  register: awx_redis_firewalld_state
  changed_when: false
  failed_when: false

- name: Check Redis firewalld port
  ansible.builtin.command:
    cmd: "firewall-cmd --query-port={{ awx_redis_port }}/tcp"
  register: awx_redis_firewalld_port
  changed_when: false
  failed_when: false
  when: awx_redis_firewalld_state.stdout == "active"

- name: Open Redis firewalld port
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --add-port={{ awx_redis_port }}/tcp"
  register: awx_redis_firewalld_open
  changed_when: true
  when:
    - awx_redis_firewalld_state.stdout == "active"
    - awx_redis_firewalld_port.rc != 0

- name: Reload firewalld for Redis
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
  when:
    - awx_redis_firewalld_state.stdout == "active"
    - awx_redis_firewalld_open is changed
