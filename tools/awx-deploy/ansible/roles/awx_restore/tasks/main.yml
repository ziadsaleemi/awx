---
- name: Validate restore confirmation
  ansible.builtin.assert:
    that:
      - awx_restore_confirm | bool
      - awx_restore_path | length > 0
    fail_msg: "Restore is destructive. Set awx_restore_confirm=true and awx_restore_path."

- name: Stop Capstan services before restore
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - awx-web
    - awx-task
    - awx-receptor
  failed_when: false

- name: Validate database backup file
  ansible.builtin.stat:
    path: "{{ awx_restore_path }}/awx.sql"
  register: awx_restore_sql_stat
  when: inventory_hostname in (groups.get('awx_database', []) | default([]))

- name: Fail when database backup is missing
  ansible.builtin.assert:
    that:
      - awx_restore_sql_stat.stat.exists
    fail_msg: "Database backup not found at {{ awx_restore_path }}/awx.sql."
  when: inventory_hostname in (groups.get('awx_database', []) | default([]))

- name: Restore Capstan configuration archive
  ansible.builtin.unarchive:
    src: "{{ awx_restore_path }}/config-{{ inventory_hostname }}.tar.gz"
    dest: "{{ awx_server_config_dir }}"
    remote_src: true
  ignore_errors: true

- name: Check Capstan project/media archive
  ansible.builtin.stat:
    path: "{{ awx_restore_path }}/data-{{ inventory_hostname }}.tar.gz"
  register: awx_restore_data_archive

- name: Restore Capstan project/media archive
  ansible.builtin.unarchive:
    src: "{{ awx_restore_path }}/data-{{ inventory_hostname }}.tar.gz"
    dest: "{{ awx_server_data_dir }}"
    remote_src: true
  ignore_errors: true
  when: awx_restore_data_archive.stat.size | default(0) > 128

- name: Restore PostgreSQL database
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      cat {{ awx_restore_path }}/awx.sql |
      {{ awx_container_engine_cmd }} exec -i awx-postgres
      psql -v ON_ERROR_STOP=1 -U {{ awx_postgres_user }} -d {{ awx_postgres_database }}
    executable: /bin/bash
  changed_when: true
  when: inventory_hostname in (groups.get('awx_database', []) | default([]))

- name: Start Capstan receptor after restore
  ansible.builtin.systemd:
    name: awx-receptor
    state: started
  failed_when: false

- name: Start Capstan task after restore
  ansible.builtin.systemd:
    name: awx-task
    state: started
  failed_when: false

- name: Start Capstan web after restore
  ansible.builtin.systemd:
    name: awx-web
    state: started
  failed_when: false
