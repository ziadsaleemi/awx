---
- name: Wait for Capstan dependencies
  ansible.builtin.wait_for:
    host: "{{ item.host }}"
    port: "{{ item.port }}"
    timeout: 180
  loop:
    - host: "{{ awx_postgres_host }}"
      port: "{{ awx_postgres_port }}"
    - host: "{{ awx_redis_host }}"
      port: "{{ awx_redis_port }}"

- name: Render Capstan web systemd service
  ansible.builtin.template:
    src: awx-web.service.j2
    dest: /etc/systemd/system/awx-web.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush systemd handlers
  ansible.builtin.meta: flush_handlers

- name: Start Capstan web
  ansible.builtin.systemd:
    name: awx-web
    state: restarted
    enabled: true

- name: Check firewalld state
  ansible.builtin.command:
    cmd: systemctl is-active firewalld
  register: awx_web_firewalld_state
  changed_when: false
  failed_when: false

- name: Check Capstan web firewalld port
  ansible.builtin.command:
    cmd: "firewall-cmd --query-port={{ awx_web_http_port }}/tcp"
  register: awx_web_firewalld_port
  changed_when: false
  failed_when: false
  when: awx_web_firewalld_state.stdout == "active"

- name: Open Capstan web firewalld port
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --add-port={{ awx_web_http_port }}/tcp"
  register: awx_web_firewalld_open
  changed_when: true
  when:
    - awx_web_firewalld_state.stdout == "active"
    - awx_web_firewalld_port.rc != 0

- name: Reload firewalld for Capstan web
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
  when:
    - awx_web_firewalld_state.stdout == "active"
    - awx_web_firewalld_open is changed

- name: Wait for Capstan web
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: "{{ awx_web_http_port }}"
    timeout: 180
