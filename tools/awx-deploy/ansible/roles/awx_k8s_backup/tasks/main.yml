---
- name: Resolve kubectl command for AWX Kubernetes backup
  ansible.builtin.set_fact:
    awx_k8s_backup_kubectl: >-
      {{ awx_k8s_kubectl_binary }}{% if awx_k8s_kubeconfig | length > 0 %} --kubeconfig {{ awx_k8s_kubeconfig }}{% endif %}

- name: Wait for Kubernetes API readiness before backup
  ansible.builtin.command:
    cmd: "{{ awx_k8s_backup_kubectl }} get --raw=/readyz"
  register: awx_k8s_backup_readyz
  retries: 60
  delay: 5
  until: awx_k8s_backup_readyz.rc == 0
  changed_when: false

- name: Create Kubernetes backup directory
  ansible.builtin.file:
    path: "{{ awx_k8s_backup_path }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Resolve AWX PostgreSQL pod
  ansible.builtin.command:
    cmd: "{{ awx_k8s_backup_kubectl }} -n {{ awx_k8s_namespace }} get pod -l app.kubernetes.io/name={{ awx_k8s_name }}-postgres -o jsonpath='{.items[0].metadata.name}'"
  register: awx_k8s_backup_postgres_pod
  changed_when: false

- name: Validate AWX PostgreSQL pod
  ansible.builtin.assert:
    that:
      - awx_k8s_backup_postgres_pod.stdout | length > 0
    fail_msg: "No {{ awx_k8s_name }}-postgres pod found in namespace {{ awx_k8s_namespace }}."

- name: Dump AWX PostgreSQL database from Kubernetes
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ awx_k8s_backup_kubectl }} -n {{ awx_k8s_namespace }}
      exec {{ awx_k8s_backup_postgres_pod.stdout }} -c {{ awx_postgres_container }}
      -- pg_dump --clean --if-exists -U {{ awx_postgres_user }} {{ awx_postgres_database }}
      > {{ awx_k8s_backup_path }}/awx.sql
    executable: /bin/bash
  changed_when: true

- name: Export AWX Kubernetes secrets
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ awx_k8s_backup_kubectl }} -n {{ awx_k8s_namespace }}
      get secret {{ awx_k8s_name }}-secret {{ awx_k8s_name }}-postgres {{ awx_k8s_name }}-receptor -o json |
      python3 -c 'import json, sys; data=json.load(sys.stdin); keys=("resourceVersion", "uid", "selfLink", "creationTimestamp", "managedFields"); [data.setdefault("metadata", {}).pop(key, None) for key in keys]; items=data.get("items") if isinstance(data.get("items"), list) else [data]; [item.setdefault("metadata", {}).pop(key, None) for item in items for key in keys]; [item.get("metadata", {}).get("annotations", {}).pop("kubectl.kubernetes.io/last-applied-configuration", None) for item in items]; print(json.dumps(data, indent=2, sort_keys=True))'
      > {{ awx_k8s_backup_path }}/k8s-secrets.yml
    executable: /bin/bash
  changed_when: true

- name: Export AWX Kubernetes config maps
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ awx_k8s_backup_kubectl }} -n {{ awx_k8s_namespace }}
      get configmap {{ awx_k8s_name }}-nginx -o json |
      python3 -c 'import json, sys; data=json.load(sys.stdin); keys=("resourceVersion", "uid", "selfLink", "creationTimestamp", "managedFields"); [data.setdefault("metadata", {}).pop(key, None) for key in keys]; items=data.get("items") if isinstance(data.get("items"), list) else [data]; [item.setdefault("metadata", {}).pop(key, None) for item in items for key in keys]; [item.get("metadata", {}).get("annotations", {}).pop("kubectl.kubernetes.io/last-applied-configuration", None) for item in items]; print(json.dumps(data, indent=2, sort_keys=True))'
      > {{ awx_k8s_backup_path }}/k8s-configmaps.yml
    executable: /bin/bash
  changed_when: true

- name: Export AWX Kubernetes resource inventory
  ansible.builtin.shell:
    cmd: >-
      {{ awx_k8s_backup_kubectl }} -n {{ awx_k8s_namespace }}
      get all,pvc,secret,configmap,ingress -o yaml
      > {{ awx_k8s_backup_path }}/k8s-resources.yml
    executable: /bin/bash
  changed_when: true
  failed_when: false

- name: Resolve AWX web pod for project/media backup
  ansible.builtin.command:
    cmd: "{{ awx_k8s_backup_kubectl }} -n {{ awx_k8s_namespace }} get pod -l app.kubernetes.io/name={{ awx_k8s_name }}-web -o jsonpath='{.items[0].metadata.name}'"
  register: awx_k8s_backup_web_pod
  changed_when: false
  when: awx_k8s_backup_collect_projects | bool

- name: Archive AWX Kubernetes projects and media PVC data
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ awx_k8s_backup_kubectl }} -n {{ awx_k8s_namespace }}
      exec {{ awx_k8s_backup_web_pod.stdout }} -c {{ awx_k8s_web_container }}
      -- bash -lc 'cd /var/lib/awx && tar -czf - projects public/media'
      > {{ awx_k8s_backup_path }}/data.tar.gz
    executable: /bin/bash
  changed_when: true
  when:
    - awx_k8s_backup_collect_projects | bool
    - awx_k8s_backup_web_pod.stdout | length > 0

- name: Write AWX Kubernetes backup manifest
  ansible.builtin.copy:
    dest: "{{ awx_k8s_backup_path }}/manifest-{{ inventory_hostname }}.yml"
    owner: root
    group: root
    mode: "0600"
    content: |
      backup_name: {{ awx_k8s_backup_name }}
      host: {{ inventory_hostname }}
      deploy_method: k8s
      namespace: {{ awx_k8s_namespace }}
      awx_name: {{ awx_k8s_name }}
      created_at: {{ ansible_date_time.iso8601 | default('unknown') }}
      includes:
        database: true
        secrets: true
        configmaps: true
        resources: true
        projects_media: {{ awx_k8s_backup_collect_projects | bool }}
