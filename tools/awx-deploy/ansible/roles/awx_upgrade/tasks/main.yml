---
- name: Backup before upgrade
  ansible.builtin.include_role:
    name: awx_backup
  when: not awx_upgrade_skip_backup | bool

- name: Pull target AWX image
  ansible.builtin.command:
    cmd: "{{ awx_container_engine_cmd }} pull {{ awx_image }}:{{ awx_image_tag }}"
  changed_when: "'Downloaded newer image' in awx_upgrade_pull.stdout or 'Pull complete' in awx_upgrade_pull.stdout"
  register: awx_upgrade_pull
  when: not awx_skip_image_pull | bool

- name: Re-run receptor role on receptor nodes
  ansible.builtin.include_role:
    name: awx_receptor
  when: inventory_hostname in (groups.get('awx_receptor', []) | default([]))

- name: Re-run task role on task nodes
  ansible.builtin.include_role:
    name: awx_task
  when: inventory_hostname in (groups.get('awx_task', []) | default([]))

- name: Re-run web role on web nodes
  ansible.builtin.include_role:
    name: awx_web
  when: inventory_hostname in (groups.get('awx_web', []) | default([]))

- name: Restart load balancer
  ansible.builtin.service:
    name: haproxy
    state: restarted
  when: inventory_hostname in (groups.get('awx_lb', []) | default([]))
  failed_when: false
