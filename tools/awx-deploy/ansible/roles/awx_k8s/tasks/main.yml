---
- name: Resolve kubectl command
  ansible.builtin.set_fact:
    awx_k8s_kubectl: >-
      {{ awx_k8s_kubectl_binary }}{% if awx_k8s_kubeconfig | length > 0 %} --kubeconfig {{ awx_k8s_kubeconfig }}{% endif %}

- name: Wait for Kubernetes API readiness
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} get --raw=/readyz"
  register: awx_k8s_readyz
  retries: 60
  delay: 5
  until: awx_k8s_readyz.rc == 0
  changed_when: false

- name: Ensure AWX Kubernetes namespace exists
  ansible.builtin.shell:
    cmd: >-
      {{ awx_k8s_kubectl }} create namespace {{ awx_k8s_namespace }}
      --dry-run=client -o yaml |
      {{ awx_k8s_kubectl }} apply -f -
  register: awx_k8s_namespace_apply
  changed_when: "'created' in awx_k8s_namespace_apply.stdout"

- name: Check firewalld state for Kubernetes pod networking
  ansible.builtin.command:
    cmd: systemctl is-active firewalld
  register: awx_k8s_firewalld_pod_state
  changed_when: false
  failed_when: false
  when: awx_k8s_manage_firewalld | bool

- name: Check Kubernetes pod interfaces in trusted firewalld zone
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --zone=trusted --query-interface={{ item }}"
  loop: "{{ awx_k8s_firewalld_trusted_interfaces }}"
  register: awx_k8s_firewalld_trusted_interface
  changed_when: false
  failed_when: false
  when:
    - awx_k8s_manage_firewalld | bool
    - awx_k8s_firewalld_pod_state.stdout == "active"

- name: Trust Kubernetes pod interfaces in firewalld
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --zone=trusted --add-interface={{ item.item }}"
  loop: "{{ awx_k8s_firewalld_trusted_interface.results | selectattr('rc', 'ne', 0) | list }}"
  register: awx_k8s_firewalld_trusted_add
  changed_when: true
  when:
    - awx_k8s_manage_firewalld | bool
    - awx_k8s_firewalld_pod_state.stdout == "active"
    - awx_k8s_firewalld_trusted_interface is defined

- name: Check kubelet metrics firewalld port
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --query-port={{ awx_k8s_firewalld_kubelet_metrics_port }}/tcp"
  register: awx_k8s_firewalld_kubelet_port
  changed_when: false
  failed_when: false
  when:
    - awx_k8s_manage_firewalld | bool
    - awx_k8s_firewalld_pod_state.stdout == "active"

- name: Open kubelet metrics port in firewalld
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --add-port={{ awx_k8s_firewalld_kubelet_metrics_port }}/tcp"
  register: awx_k8s_firewalld_kubelet_open
  changed_when: true
  when:
    - awx_k8s_manage_firewalld | bool
    - awx_k8s_firewalld_pod_state.stdout == "active"
    - awx_k8s_firewalld_kubelet_port.rc != 0

- name: Reload firewalld for Kubernetes pod networking
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
  when:
    - awx_k8s_manage_firewalld | bool
    - awx_k8s_firewalld_pod_state.stdout == "active"
    - (awx_k8s_firewalld_trusted_add is defined and awx_k8s_firewalld_trusted_add is changed) or (awx_k8s_firewalld_kubelet_open is defined and awx_k8s_firewalld_kubelet_open is changed)

- name: Read existing Kubernetes secret key when not provided
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} -n {{ awx_k8s_namespace }} get secret {{ awx_k8s_name }}-secret -o jsonpath='{.data.SECRET_KEY}'"
  register: awx_k8s_existing_secret_key
  changed_when: false
  failed_when: false
  when: (awx_secret_key | default('')) | length == 0
  no_log: true

- name: Generate Kubernetes secret key when not provided
  ansible.builtin.command:
    cmd: openssl rand -base64 32
  register: awx_k8s_generated_secret_key
  changed_when: false
  when:
    - (awx_secret_key | default('')) | length == 0
    - (awx_k8s_existing_secret_key.stdout | default('')) | length == 0
  no_log: true

- name: Set Kubernetes secret key fact
  ansible.builtin.set_fact:
    awx_k8s_effective_secret_key: >-
      {{ awx_secret_key | default('')
        if (awx_secret_key | default('')) | length > 0
        else (awx_k8s_existing_secret_key.stdout | b64decode
          if (awx_k8s_existing_secret_key.stdout | default('')) | length > 0
          else awx_k8s_generated_secret_key.stdout) }}
  no_log: true

- name: Check existing Kubernetes receptor secret
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} -n {{ awx_k8s_namespace }} get secret {{ awx_k8s_name }}-receptor"
  register: awx_k8s_receptor_secret
  changed_when: false
  failed_when: false
  no_log: true

- name: Create Kubernetes receptor material workspace
  ansible.builtin.file:
    path: "{{ awx_k8s_work_dir }}/receptor"
    state: directory
    mode: "0700"
  when: awx_k8s_receptor_secret.rc != 0

- name: Generate Kubernetes receptor mesh CA key
  ansible.builtin.command:
    cmd: "openssl genrsa -out {{ awx_k8s_work_dir }}/receptor/mesh-CA.key 4096"
    creates: "{{ awx_k8s_work_dir }}/receptor/mesh-CA.key"
  when: awx_k8s_receptor_secret.rc != 0
  no_log: true

- name: Generate Kubernetes receptor mesh CA certificate
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -new -nodes
      -key {{ awx_k8s_work_dir }}/receptor/mesh-CA.key
      -sha256 -days 3650
      -subj /CN={{ awx_k8s_name }}-receptor-mesh-ca
      -out {{ awx_k8s_work_dir }}/receptor/mesh-CA.crt
    creates: "{{ awx_k8s_work_dir }}/receptor/mesh-CA.crt"
  when: awx_k8s_receptor_secret.rc != 0
  no_log: true

- name: Generate Kubernetes receptor node key
  ansible.builtin.command:
    cmd: "openssl genrsa -out {{ awx_k8s_work_dir }}/receptor/receptor.key 2048"
    creates: "{{ awx_k8s_work_dir }}/receptor/receptor.key"
  when: awx_k8s_receptor_secret.rc != 0
  no_log: true

- name: Generate Kubernetes receptor node certificate request
  ansible.builtin.command:
    cmd: >-
      openssl req -new
      -key {{ awx_k8s_work_dir }}/receptor/receptor.key
      -subj /CN={{ awx_k8s_name }}-control-plane
      -out {{ awx_k8s_work_dir }}/receptor/receptor.csr
    creates: "{{ awx_k8s_work_dir }}/receptor/receptor.csr"
  when: awx_k8s_receptor_secret.rc != 0
  no_log: true

- name: Generate Kubernetes receptor node certificate
  ansible.builtin.command:
    cmd: >-
      openssl x509 -req
      -in {{ awx_k8s_work_dir }}/receptor/receptor.csr
      -CA {{ awx_k8s_work_dir }}/receptor/mesh-CA.crt
      -CAkey {{ awx_k8s_work_dir }}/receptor/mesh-CA.key
      -CAcreateserial
      -out {{ awx_k8s_work_dir }}/receptor/receptor.crt
      -days 3650 -sha256
    creates: "{{ awx_k8s_work_dir }}/receptor/receptor.crt"
  when: awx_k8s_receptor_secret.rc != 0
  no_log: true

- name: Generate Kubernetes receptor work signing private key
  ansible.builtin.command:
    cmd: "openssl genrsa -out {{ awx_k8s_work_dir }}/receptor/work_private_key.pem 2048"
    creates: "{{ awx_k8s_work_dir }}/receptor/work_private_key.pem"
  when: awx_k8s_receptor_secret.rc != 0
  no_log: true

- name: Generate Kubernetes receptor work signing public key
  ansible.builtin.command:
    cmd: >-
      openssl rsa
      -in {{ awx_k8s_work_dir }}/receptor/work_private_key.pem
      -out {{ awx_k8s_work_dir }}/receptor/work_public_key.pem
      -outform PEM -pubout
    creates: "{{ awx_k8s_work_dir }}/receptor/work_public_key.pem"
  when: awx_k8s_receptor_secret.rc != 0
  no_log: true

- name: Create Kubernetes receptor secret
  ansible.builtin.command:
    cmd: >-
      {{ awx_k8s_kubectl }} -n {{ awx_k8s_namespace }} create secret generic {{ awx_k8s_name }}-receptor
      --from-file=mesh-CA.crt={{ awx_k8s_work_dir }}/receptor/mesh-CA.crt
      --from-file=mesh-CA.key={{ awx_k8s_work_dir }}/receptor/mesh-CA.key
      --from-file=receptor.crt={{ awx_k8s_work_dir }}/receptor/receptor.crt
      --from-file=receptor.key={{ awx_k8s_work_dir }}/receptor/receptor.key
      --from-file=work_private_key.pem={{ awx_k8s_work_dir }}/receptor/work_private_key.pem
      --from-file=work_public_key.pem={{ awx_k8s_work_dir }}/receptor/work_public_key.pem
  register: awx_k8s_create_receptor_secret
  changed_when: "'created' in awx_k8s_create_receptor_secret.stdout"
  when: awx_k8s_receptor_secret.rc != 0
  no_log: true

- name: Create Kubernetes manifest workspace
  ansible.builtin.file:
    path: "{{ awx_k8s_work_dir }}"
    state: directory
    mode: "0700"

- name: Render Kubernetes manifests
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ awx_k8s_work_dir }}/{{ item }}"
    mode: "0600"
  loop:
    - 00-core.yml
    - 10-data.yml
    - 20-migrate.yml
    - 30-awx.yml
  no_log: true

- name: Apply core Kubernetes resources
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} apply -f {{ awx_k8s_work_dir }}/00-core.yml"
  register: awx_k8s_apply_core
  changed_when: "'created' in awx_k8s_apply_core.stdout or 'configured' in awx_k8s_apply_core.stdout"

- name: Apply data services
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} apply -f {{ awx_k8s_work_dir }}/10-data.yml"
  register: awx_k8s_apply_data
  changed_when: "'created' in awx_k8s_apply_data.stdout or 'configured' in awx_k8s_apply_data.stdout"

- name: Wait for PostgreSQL deployment
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} -n {{ awx_k8s_namespace }} rollout status deployment/{{ awx_k8s_name }}-postgres --timeout=300s"
  changed_when: false

- name: Wait for Redis deployment
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} -n {{ awx_k8s_namespace }} rollout status deployment/{{ awx_k8s_name }}-redis --timeout=180s"
  changed_when: false

- name: Remove previous migration job
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} -n {{ awx_k8s_namespace }} delete job {{ awx_k8s_name }}-migrate --ignore-not-found=true"
  changed_when: "'deleted' in awx_k8s_delete_migrate.stdout"
  register: awx_k8s_delete_migrate

- name: Apply migration job
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} apply -f {{ awx_k8s_work_dir }}/20-migrate.yml"
  register: awx_k8s_apply_migrate
  changed_when: "'created' in awx_k8s_apply_migrate.stdout or 'configured' in awx_k8s_apply_migrate.stdout"

- name: Wait for migration job
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} -n {{ awx_k8s_namespace }} wait --for=condition=complete job/{{ awx_k8s_name }}-migrate --timeout=600s"
  changed_when: false

- name: Apply AWX application
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} apply -f {{ awx_k8s_work_dir }}/30-awx.yml"
  register: awx_k8s_apply_awx
  changed_when: "'created' in awx_k8s_apply_awx.stdout or 'configured' in awx_k8s_apply_awx.stdout"

- name: Restart AWX deployments after config changes
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} -n {{ awx_k8s_namespace }} rollout restart deployment/{{ item }}"
  loop:
    - "{{ awx_k8s_name }}-web"
    - "{{ awx_k8s_name }}-task"
  register: awx_k8s_rollout_restart
  changed_when: "'restarted' in awx_k8s_rollout_restart.stdout"
  when: awx_k8s_apply_core is changed or awx_k8s_apply_awx is changed

- name: Check firewalld state for Kubernetes NodePort
  ansible.builtin.command:
    cmd: systemctl is-active firewalld
  register: awx_k8s_firewalld_state
  changed_when: false
  failed_when: false
  when: awx_k8s_service_type == "NodePort"

- name: Check Kubernetes NodePort firewalld port
  ansible.builtin.command:
    cmd: "firewall-cmd --query-port={{ awx_k8s_node_port }}/tcp"
  register: awx_k8s_firewalld_port
  changed_when: false
  failed_when: false
  when:
    - awx_k8s_service_type == "NodePort"
    - awx_k8s_firewalld_state.stdout == "active"

- name: Open Kubernetes NodePort in firewalld
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --add-port={{ awx_k8s_node_port }}/tcp"
  register: awx_k8s_firewalld_open
  changed_when: true
  when:
    - awx_k8s_service_type == "NodePort"
    - awx_k8s_firewalld_state.stdout == "active"
    - awx_k8s_firewalld_port.rc != 0

- name: Reload firewalld for Kubernetes NodePort
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
  when:
    - awx_k8s_service_type == "NodePort"
    - awx_k8s_firewalld_state.stdout == "active"
    - awx_k8s_firewalld_open is changed

- name: Wait for AWX web deployment
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} -n {{ awx_k8s_namespace }} rollout status deployment/{{ awx_k8s_name }}-web --timeout=300s"
  changed_when: false

- name: Wait for AWX task deployment
  ansible.builtin.command:
    cmd: "{{ awx_k8s_kubectl }} -n {{ awx_k8s_namespace }} rollout status deployment/{{ awx_k8s_name }}-task --timeout=300s"
  changed_when: false
