# Local Galaxy NG nginx config for Docker Desktop development.
#
# The upstream Galaxy NG standalone compose stack proxies /ui/ back to the
# Django API container. That works only when the API image carries the bundled
# galaxy_ng static UI. Our local stack uses the separate galaxy-web image, so
# serve /ui/ and /static/galaxy_ng/ from a mounted static bundle and keep the
# API/content/container routes proxied to Galaxy NG/Pulp.

worker_processes 1;

events {
    worker_connections 1024;
    accept_mutex off;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    types_hash_max_size 4096;

    upstream pulp-content {
         server content:24816;
    }

    upstream pulp-api {
         server api:8000;
    }

    server {
        listen 5001 default_server deferred;
        server_name $hostname;
        client_max_body_size 10m;
        keepalive_timeout 5;

        location /ui/ {
            alias /opt/galaxy-web/;
            try_files $uri $uri/ /static/galaxy_ng/index.html;
        }

        location /static/galaxy_ng/ {
            alias /opt/galaxy-web/;
            try_files $uri =404;
        }

        location /pulp/content/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://pulp-content;
        }

        location /api/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://pulp-api;
            client_max_body_size 0;
        }

        location /auth/login/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://pulp-api;
        }

        location /v2/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://pulp-api;
            client_max_body_size 0;
        }

        location /extensions/v2/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://pulp-api;
        }

        location /pulp/container/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://pulp-content;
        }

        location /token/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://pulp-api;
        }

        location /pulp_ansible/galaxy/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://pulp-api;
        }

        location / {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://pulp-api;
        }
    }
}
