---
# install_apache.yml
#
# Installs Apache (httpd / apache2) on a freshly provisioned VM.
# The target host IP is passed from the upstream Terraform job via
# the workflow artifact "host_ip_proxmox_vm".
#
# AWX wires the artifact into extra_vars automatically, so the playbook
# can use it directly in the hosts line.
#
# Survey / extra_vars used:
#   host_ip_proxmox_vm  - IP address of the VM (from Terraform artifact)
#   vm_ssh_user         - SSH user (default: ansible)
#   vm_ssh_password     - SSH password (default: ansible)
#   vm_ssh_port         - SSH port (default: 22)
#
- name: Provision Apache web server
  hosts: "{{ host_ip_proxmox_vm }}"
  gather_facts: true
  become: true
  vars:
    ansible_user: "{{ vm_ssh_user | default('ansible') }}"
    ansible_password: "{{ vm_ssh_password | default('ansible') }}"
    ansible_port: "{{ vm_ssh_port | default(22) }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

    - name: Gather facts after SSH is ready
      ansible.builtin.setup:

    - name: Wait for dpkg/apt lock to be released (Debian/Ubuntu)
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 3
        done
      changed_when: false
      when: ansible_os_family == 'Debian'
      timeout: 300

    - name: Install Apache (Debian/Ubuntu)
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Install Apache (RedHat/CentOS)
      ansible.builtin.dnf:
        name: httpd
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Start and enable Apache (Debian)
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true
      when: ansible_os_family == 'Debian'

    - name: Start and enable Apache (RedHat)
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
      when: ansible_os_family == 'RedHat'

    - name: Verify Apache is responding
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(inventory_hostname) }}"
        return_content: true
        status_code: 200
        timeout: 10
      register: apache_check
      failed_when: false

    - name: Report Apache status
      ansible.builtin.debug:
        msg: >
          Apache installed on {{ inventory_hostname }}.
          HTTP status: {{ apache_check.status | default('N/A') }}.
          {{ 'Responding OK!' if apache_check.status | default(0) == 200 else 'Check firewall rules if not responding.' }}
